<div class="min-h-screen bg-slate-50 p-6 flex items-center justify-center bg-[url('https://grainy-gradients.vercel.app/noise.svg')] bg-repeat">
  <div class="w-full max-w-2xl bg-white/70 backdrop-blur-3xl border border-white/20 shadow-2xl rounded-[40px] overflow-hidden">
    <div class="p-10 border-b border-slate-100 text-center">
       <div class="w-20 h-20 bg-indigo-600 rounded-3xl mx-auto mb-6 flex items-center justify-center text-white text-3xl font-black shadow-2xl shadow-indigo-200 rotate-3">DC</div>
       <h1 class="text-3xl font-black text-slate-900 tracking-tight">Default Clinic</h1>
       <p class="text-slate-500 mt-2">Escolha uma data e horário para seu agendamento</p>
    </div>

    <div class="p-10">
       <div class="space-y-8">
          <section>
             <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4">1. Escolha o serviço</h3>
             <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <button *ngFor="let s of ['Consulta Geral', 'Limpeza', 'Exame X', 'Retorno']" class="p-4 border border-slate-100 rounded-2xl text-left hover:border-indigo-500 hover:bg-indigo-50/50 transition-all duration-300 group">
                   <p class="text-sm font-bold text-slate-900 group-hover:text-indigo-700">{{ s }}</p>
                   <p class="text-xs text-slate-500">30 min • R$ 100,00</p>
                </button>
             </div>
          </section>

          <section>
             <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4">2. Escolha o horário</h3>
             <div class="flex gap-2 overflow-x-auto pb-4 -mx-2 px-2 scrollbar-none">
                <button *ngFor="let d of days" class="flex-shrink-0 w-20 p-4 border border-slate-100 rounded-2xl text-center hover:border-indigo-500 hover:bg-indigo-50/50 transition-all">
                   <p class="text-[10px] font-bold text-slate-400 uppercase">{{ d.week }}</p>
                   <p class="text-lg font-black text-slate-900">{{ d.day }}</p>
                </button>
             </div>
             
             <div class="grid grid-cols-4 md:grid-cols-6 gap-3 mt-6">
                <button *ngFor="let time of ['09:00', '09:30', '10:00', '10:30', '11:00', '14:00', '14:30', '15:00']" class="py-3 border border-slate-100 rounded-xl text-center text-sm font-bold text-slate-600 hover:bg-slate-900 hover:text-white transition-all">
                   {{ time }}
                </button>
             </div>
          </section>

          <button class="w-full bg-indigo-600 text-white font-bold py-4 rounded-2xl shadow-xl shadow-indigo-100 hover:bg-indigo-700 transition-all active:scale-95 text-lg mt-10">
             Confirmar Agendamento
          </button>
       </div>
    </div>
  </div>
</div>
